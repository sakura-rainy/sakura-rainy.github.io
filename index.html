 c.lineWidth=.45;c.strokeStyle='#ba6c952a';for(let j=-2;j<=2;j++){c.beginPath();c.moveTo(0,24);c.quadraticCurveTo(j*7,0,j*7,-16+Math.abs(j)*3);c.stroke();}return cv;
}
const textures=[sprite(false),sprite(true)];
const petals=Array.from({length:60},()=>({x:rnd(),y:rnd(),depth:rnd(),phase:rnd()*Math.PI*2,roll:rnd()*Math.PI*2,spin:(rnd()-.5)*.5,drift:rnd(),age:10}));
function reset(p){p.x=rnd()<.75?.08+rnd()*.52:.85+rnd()*.15;p.y=.03+rnd()*.15;p.age=0;}
function draw(dt){
 ctx.clearRect(0,0,w,h);if(playing)time+=dt;
 const count=Math.min(cfg.count,Math.max(14,Math.round(cfg.count*w/1024)));
 for(let i=0;i<count;i++){
  const p=petals[i],d=p.depth;
  if(playing){p.age+=dt;p.y+=(.010+d*.012)*dt;p.x+=(.0035+Math.sin(time*.22+p.phase)*.002)*dt;p.roll+=p.spin*dt;if(p.y>1.03||p.x>1.04)reset(p);}
  const x=p.x*w+Math.sin(time*.5+p.phase)*(3+d*4),y=p.y*h+Math.cos(time*.5+p.phase)*1.5;
  const size=(2.2+Math.pow(d,2)*5.4)*Math.min(1,w/740+.2);
  const fade=Math.min(1,p.age/2.5)*Math.min(1,Math.max(0,(1-p.y)/.07));
  ctx.save();ctx.translate(x,y);ctx.rotate(p.roll+Math.sin(time*.3+p.phase)*.12);ctx.scale(.4+Math.abs(Math.sin(time*.4+p.phase))*.6,1);ctx.globalAlpha=(.48+d*.34)*fade;
  ctx.drawImage(textures[d>.86?1:0],-size*.7,-size*.88,size*1.4,size*1.76);ctx.restore();
 }
}
function label(){pause.textContent=playing?'暂停':'播放';pause.setAttribute('aria-label',playing?'暂停花瓣飘落':'播放花瓣飘落');}
function resize(){const r=scene.getBoundingClientRect();w=r.width;h=r.height;const d=Math.min(devicePixelRatio||1,1.5);canvas.width=Math.round(w*d);canvas.height=Math.round(h*d);ctx.setTransform(d,0,0,d,0,0);draw(0);}
pause.addEventListener('click',()=>{playing=!playing;label();});
new ResizeObserver(resize).observe(scene);new IntersectionObserver(e=>{visible=e[0].isIntersecting;}).observe(scene);
reduced.addEventListener('change',()=>{playing=!reduced.matches;label();draw(0);});
function frame(now){if(now-last>=32){const dt=Math.min((now-last)/1000,.06);last=now;if(playing&&visible&&!document.hidden)draw(dt);}requestAnimationFrame(frame);}
resize();label();requestAnimationFrame(frame);
})();
</script>
